[project]
name = "flighty-mcp"
version = "0.1.0"
description = "MCP server that adds flights to your Flighty account"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx[http2]>=0.27",
    "protobuf>=5.26",
    "grpcio-tools>=1.60",
]

[project.scripts]
flighty-mcp = "flighty_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flighty_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/flighty_mcp/schema" = "flighty_mcp/schema"
