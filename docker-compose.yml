# The read-only MCP server, behind the gateway.
#
# No ports, no Traefik labels and no router: the only thing that can reach this
# is mcp-gateway, over the internal `sensitive` network, and the gateway is what
# authenticates the caller.
#
# Deployed by checking this repository out on the host and running it from
# there, so `build: .` and `./data` are the checkout. Two things in that
# directory are not in git and must survive a pull: `.env`, holding the token
# pair, and `data/`, holding the database snapshot.
services:
  flighty-mcp:
    build: .
    container_name: flighty-mcp
    restart: unless-stopped
    environment:
      - FLIGHTY_AUTH_TOKEN=${FLIGHTY_AUTH_TOKEN}
      - FLIGHTY_BUILD_TOKEN=${FLIGHTY_BUILD_TOKEN}
    volumes:
      # Snapshot of the Mac's Flighty database: reference tables and the
      # account's flight list, with the Account row stripped. Refreshed by
      # scripts/export-db.sh on the Mac.
      - ./data:/data:ro
    networks:
      - sensitive

networks:
  # The high-sensitivity plane: the gateway, its five MCP backends, and the
  # ledger server. Deliberately NOT `proxy` -- that network also carries the
  # web UIs, the exporters and nzbget, and anything on it can open an
  # unauthenticated MCP session to any backend, skipping the gateway's Google
  # sign-in, email allowlist, blocklist and audit log entirely. nzbget is the
  # one that matters: it unpacks untrusted archives from usenet.
  #
  # Created out of band so that no one stack owns it:
  #   docker network create --driver bridge sensitive
  sensitive:
    external: true
